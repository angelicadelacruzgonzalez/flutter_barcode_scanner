plugins {
    id "com.android.library"
}

// Must match the package declared in pubspec.yaml and the Java sources.
group 'com.angie.flutterbarcodescannerupdate'
version '2.3.0'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.angie.flutterbarcodescannerupdate'

    compileSdk 36

    defaultConfig {
        // ML Kit barcode scanning and CameraX both require API 21.
        minSdk 21
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        // Keep the native libraries uncompressed so their 16 KB page alignment
        // survives packaging, as required by Google Play.
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Provides androidx.annotation.OptIn, used for CameraX's ExperimentalGetImage.
    implementation 'androidx.annotation:annotation-experimental:1.4.1'

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation 'com.google.guava:guava:31.1-android'
}
