// Configuración de Gradle para un plugin Flutter
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10"
    }
}

apply plugin: "com.android.library"

group 'com.angie.flutter_barcode_scanning_plus'
version '1.0.0'

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.angie.flutter_barcode_scanning_plus'
    compileSdk 36
    // buildToolsVersion eliminado: se usa el default de AGP

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'InvalidPackage'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.0'

    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    def camerax_version = "1.3.3"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation 'com.google.guava:guava:31.1-android'
}