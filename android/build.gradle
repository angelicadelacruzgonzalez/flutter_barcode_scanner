// Configuración de Gradle para un plugin Flutter
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Gradle Plugin de Android
        classpath 'com.android.tools.build:gradle:8.1.1'
        // Kotlin Gradle Plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10"
        // Flutter Gradle Plugin
        //classpath "dev.flutter:flutter-gradle-plugin:1.0.0"

  

    }
}

// Aplicar los plugins
apply plugin: "com.android.library"
apply plugin: "kotlin-android"
//apply plugin: "dev.flutter.flutter-gradle-plugin"

// Información del plugin
group 'com.angie.flutter_bluetooth_serial_plus_plus'
version '1.0.0'

// Repositorios para dependencias
repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.angie.flutterbluetoothserialplus'
    compileSdkVersion 35
    buildToolsVersion '30.0.3'
   kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.3.0'
    }
}

// Dependencias adicionales del plugin
dependencies {
    // Aquí puedes agregar otras librerías necesarias
          // ML Kit Barcode Scanning
           // implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            implementation 'com.google.mlkit:barcode-scanning:17.1.0'

            // CameraX
            def camerax_version = "1.3.3"  // estable y probado
            implementation "androidx.camera:camera-core:$camerax_version"
            implementation "androidx.camera:camera-camera2:$camerax_version"
            implementation "androidx.camera:camera-lifecycle:$camerax_version"
            implementation "androidx.camera:camera-view:1.3.3"
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            // Lifecycle
                implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"


            // Guava (para ListenableFuture de CameraX)
            implementation 'com.google.guava:guava:31.1-android'
}
